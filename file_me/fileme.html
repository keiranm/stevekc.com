<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>send steve a file</title>
<style>
  :root{
    --bg:#12151a;
    --panel:#1a1f27;
    --panel-edge:#252c37;
    --text:#e7e9ec;
    --text-dim:#8b93a1;
    --amber:#FE5800;
    --green:#4fb87a;
    --red:#e2685f;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, #1e2530 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{ width:100%; max-width:440px; }
  .crumb{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
    font-family:var(--mono);
    margin:0 0 24px;
  }
  .crumb a{ color:var(--text-dim); text-decoration:none; font-size:13px; }
  .crumb a:hover{ color:var(--amber); }
  .crumb .sep{ color:var(--text-dim); font-size:13px; }
  .crumb .current{ color:var(--text); font-size:22px; font-weight:600; }
  label{
    display:block;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    margin:0 0 6px;
  }
  textarea#note{
    width:100%;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    padding:10px 12px;
    margin-bottom:16px;
    resize:vertical;
    min-height:60px;
  }
  textarea#note:focus{ outline:none; border-color:var(--amber); }
  .dropzone{
    position:relative;
    border:1.5px dashed var(--panel-edge);
    background:var(--panel);
    border-radius:14px;
    padding:36px 20px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone.hover{ border-color:var(--amber); background:#20191045; }
  .dropzone.hover .slot-glow{ opacity:1; }
  .slot{
    width:64px;
    height:14px;
    margin:0 auto 18px;
    border-radius:7px;
    background:linear-gradient(180deg, #0c0e12, #000);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.6), 0 0 0 1px var(--panel-edge);
    position:relative;
    overflow:hidden;
  }
  .slot-glow{
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, var(--amber), transparent);
    opacity:0;
    transition:opacity .2s ease;
  }
  .dz-title{ font-family:var(--mono); font-size:15px; color:var(--text); margin:0 0 4px; }
  .dz-sub{ font-size:12.5px; color:var(--text-dim); }
  input[type=file]{ display:none; }
  .filelist{ margin-top:16px; }
  .fileitem{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    padding:12px 14px;
    margin-top:10px;
    font-size:13.5px;
  }
  .fileitem .name{
    font-family:var(--mono);
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:block;
    margin-bottom:8px;
  }
  .bar-track{ height:6px; border-radius:4px; background:#0e1116; overflow:hidden; }
  .bar-fill{ height:100%; width:0%; background:var(--amber); transition:width .12s linear; }
  .status-row{
    display:flex;
    justify-content:space-between;
    margin-top:6px;
    font-size:11.5px;
    color:var(--text-dim);
    font-family:var(--mono);
  }
  .status-row.ok .status-text{ color:var(--green); }
  .status-row.err .status-text{ color:var(--red); }
</style>
</head>
<body>
  <div class="card">
    <div class="crumb">
      <a href="https://stevekc.com/">stevekc.com</a>
      <span class="sep">›</span>
      <span class="current">send me a file</span>
    </div>

    <label for="note">note (optional)</label>
    <textarea id="note" maxlength="500" placeholder="anything you want to say about this"></textarea>

    <div class="dropzone" id="dropzone">
      <div class="slot"><div class="slot-glow"></div></div>
      <p class="dz-title" id="dzTitle">tap to choose a file, or drop it here</p>
      <p class="dz-sub">up to 500 mb · any file type</p>
      <input type="file" id="fileInput" multiple>
    </div>

    <div class="filelist" id="fileList"></div>
  </div>

<script>
const API_BASE = "https://sf06p1myta.execute-api.ap-southeast-2.amazonaws.com";
const MAX_BYTES = 524288000;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const noteField = document.getElementById('note');

dropzone.addEventListener('click', () => fileInput.click());

['dragenter','dragover'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('hover'); })
);
['dragleave','drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('hover'); })
);
dropzone.addEventListener('drop', e => { handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function humanSize(bytes){
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' kb';
  return (bytes/(1024*1024)).toFixed(1) + ' mb';
}

function fileExt(name){
  const parts = (name || '').split('.');
  return parts.length > 1 ? parts.pop() : '';
}

function handleFiles(files){
  [...files].forEach(uploadFile);
}

async function uploadFile(file){
  const item = document.createElement('div');
  item.className = 'fileitem';
  item.innerHTML = `
    <span class="name">${file.name}</span>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="status-row">
      <span class="status-text">preparing…</span>
      <span class="status-size">${humanSize(file.size)}</span>
    </div>
  `;
  fileList.prepend(item);
  const bar = item.querySelector('.bar-fill');
  const statusRow = item.querySelector('.status-row');
  const statusText = item.querySelector('.status-text');

  if (file.size > MAX_BYTES){
    statusRow.classList.add('err');
    statusText.textContent = 'too large — 500 mb limit';
    return;
  }

  try{
    const params = new URLSearchParams({ filename: file.name, ext: fileExt(file.name) });
    const res = await fetch(`${API_BASE}/upload-url?${params}`);
    if (!res.ok) throw new Error('Could not prepare upload');
    const { url, fields } = await res.json();

    const formData = new FormData();
    Object.entries(fields).forEach(([k,v]) => formData.append(k, v));
    formData.append('x-amz-meta-note', noteField.value.trim().slice(0, 500));
    formData.append('file', file);

    statusText.textContent = 'uploading…';

    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable){
          const pct = Math.round((e.loaded/e.total)*100);
          bar.style.width = pct + '%';
          statusText.textContent = pct < 100 ? `uploading… ${pct}%` : 'finishing…';
        }
      };
      xhr.onload = () => (xhr.status === 204 || xhr.status === 201 || xhr.status === 200) ? resolve() : reject(new Error('Upload failed'));
      xhr.onerror = () => reject(new Error('Network error'));
      xhr.send(formData);
    });

    bar.style.width = '100%';
    statusRow.classList.add('ok');
    statusText.textContent = 'sent ✓';
  } catch (err){
    statusRow.classList.add('err');
    statusText.textContent = 'failed — try again';
  }
}
</script>
</body>
</html>
