<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>send steve a message</title>
<style>
  :root{
    --bg:#12151a;
    --panel:#1a1f27;
    --panel-edge:#252c37;
    --text:#e7e9ec;
    --text-dim:#8b93a1;
    --amber:#FE5800;
    --green:#4fb87a;
    --red:#e2685f;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 80% -10%, #1e2530 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{ width:100%; max-width:440px; }
  .crumb{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
    font-family:var(--mono);
    margin:0 0 28px;
  }
  .crumb a{
    color:var(--text-dim);
    text-decoration:none;
    font-size:13px;
  }
  .crumb a:hover{ color:var(--amber); }
  .crumb .sep{ color:var(--text-dim); font-size:13px; }
  .crumb .current{
    color:var(--text);
    font-size:22px;
    font-weight:600;
  }
  .qr-wrap{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
  }
  .qr-wrap svg{
    width:72px;
    height:72px;
    flex-shrink:0;
    background:#fff;
    border-radius:6px;
    padding:6px;
  }
  .qr-note{
    font-size:12px;
    color:var(--text-dim);
    font-family:var(--mono);
    line-height:1.5;
  }
  label{
    display:block;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    margin:0 0 6px;
  }
  input[type=text], textarea{
    width:100%;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    color:var(--text);
    font-family:var(--sans);
    font-size:14.5px;
    padding:12px 14px;
    margin-bottom:16px;
    resize:vertical;
  }
  textarea{ min-height:110px; }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--amber);
  }
  button{
    width:100%;
    background:var(--amber);
    color:#1a0e06;
    border:none;
    border-radius:10px;
    font-family:var(--mono);
    font-weight:600;
    font-size:13px;
    padding:13px;
    cursor:pointer;
    transition:opacity .15s ease;
    text-transform:lowercase;
  }
  button:disabled{ opacity:.5; cursor:default; }
  .result{
    margin-top:14px;
    font-family:var(--mono);
    font-size:13px;
    text-align:center;
  }
  .result.ok{ color:var(--green); }
  .result.err{ color:var(--red); }
</style>
</head>

    <form id="msgForm">
      <label for="name">name (optional)</label>
      <input type="text" id="name" maxlength="100" placeholder="anonymous">

      <label for="message">message</label>
      <textarea id="message" maxlength="5000" required></textarea>

      <button type="submit" id="sendBtn">send message</button>
      <div class="result" id="result"></div>
    </form>
  </div>

<script>
const API_BASE = "https://sf06p1myta.execute-api.ap-southeast-2.amazonaws.com";

const form = document.getElementById('msgForm');
const btn = document.getElementById('sendBtn');
const result = document.getElementById('result');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const message = document.getElementById('message').value.trim();
  if (!message) return;

  btn.disabled = true;
  btn.textContent = 'sending…';
  result.textContent = '';
  result.className = 'result';

  try {
    const res = await fetch(`${API_BASE}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, message })
    });
    if (!res.ok) throw new Error('failed');

    result.textContent = 'sent ✓';
    result.classList.add('ok');
    form.reset();
  } catch (err) {
    result.textContent = 'could not send — try again';
    result.classList.add('err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'send message';
  }
});
</script>
